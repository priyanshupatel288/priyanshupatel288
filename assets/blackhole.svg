<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb37a" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#7A18F5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff1d0"/>
      <stop offset="40%" stop-color="#ffad5c" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ff6a3d" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7a1fa2" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="strong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="900" height="320" fill="#0d1117"/>

  <!-- background stars -->
  <g fill="#ffffff">
    <circle cx="45" cy="38" r="1.1" opacity="0.7"/>
    <circle cx="120" cy="230" r="0.9" opacity="0.5"/>
    <circle cx="190" cy="75" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="150" r="1" opacity="0.4"/>
    <circle cx="260" cy="255" r="0.9" opacity="0.5"/>
    <circle cx="310" cy="30" r="1" opacity="0.6"/>
    <circle cx="600" cy="285" r="1.1" opacity="0.5"/>
    <circle cx="815" cy="55" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="865" cy="205" r="1.3" opacity="0.8"/>
    <circle cx="770" cy="265" r="1" opacity="0.5"/>
    <circle cx="735" cy="30" r="1" opacity="0.5"/>
    <circle cx="660" cy="80" r="0.9" opacity="0.4"/>
    <circle cx="25" cy="290" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- pulsing halo -->
  <circle cx="450" cy="160" r="120" fill="url(#halo)">
    <animate attributeName="r" values="115;150;115" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 450 160;3 450 160;-3 450 160" dur="8s" repeatCount="indefinite"/>

    <!-- far side of the disk, bent over the top by gravity -->
    <g filter="url(#soft)">
      <path d="M 230,160 C 290,148 380,92 450,90 C 520,92 610,148 670,160 C 610,152 545,140 450,137 C 355,140 290,152 230,160 Z" fill="url(#disk)" opacity="0.9"/>
      <path d="M 255,152 C 320,108 395,96 450,95 C 505,96 580,108 645,152" fill="none" stroke="#fff4e0" stroke-width="1.3" opacity="0.5" stroke-dasharray="10 9">
        <animate attributeName="stroke-dashoffset" values="0;-38" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- lensed arc below -->
    <g filter="url(#soft)">
      <path d="M 388,186 C 400,236 500,236 512,186 L 509,195 C 498,224 402,224 391,195 Z" fill="url(#disk)" opacity="0.6"/>
    </g>

    <!-- event horizon -->
    <circle cx="450" cy="160" r="46" fill="#ffd9a8" opacity="0.6" filter="url(#strong)"/>
    <circle cx="450" cy="160" r="42" fill="#000000"/>
    <circle cx="450" cy="160" r="43.5" fill="none" stroke="#fff1d0" stroke-width="1.4" opacity="0.85">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- near side of the disk, in front of the shadow -->
    <g filter="url(#soft)">
      <ellipse cx="450" cy="160" rx="220" ry="20" fill="url(#disk)" opacity="0.95"/>
    </g>
    <ellipse cx="450" cy="160" rx="210" ry="14" fill="none" stroke="#fff4e0" stroke-width="1.2" opacity="0.6" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="160" rx="180" ry="9" fill="none" stroke="#ffb066" stroke-width="1" opacity="0.5" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="160" rx="240" ry="26" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.35"/>
  </g>

  <!-- matter falling in -->
  <circle r="1.8" fill="#ffd9a8">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 120,90 C 260,150 380,175 450,160"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#c084fc">
    <animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M 800,240 C 650,180 520,150 450,160"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="7s" begin="2s" repeatCount="indefinite"/>
  </circle>
</svg>
