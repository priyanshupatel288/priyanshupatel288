<svg viewBox="0 0 800 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="main" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#7A18F5" stop-opacity="0"/>
      <stop offset="0.1" stop-color="#7A18F5"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.9" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="50" fill="#0d1117"/>

  <!-- main branch -->
  <line x1="0" y1="25" x2="800" y2="25" stroke="url(#main)" stroke-width="2"/>

  <!-- feature branch: splits off and merges back -->
  <path d="M300 25 C340 25 340 9 380 9 L420 9 C460 9 460 25 500 25" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="380" cy="9" r="4" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="420" cy="9" r="4" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>
  <circle r="2.5" fill="#cffafe">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.375;0.625;1" calcMode="linear" path="M300 25 C340 25 340 9 380 9 L420 9 C460 9 460 25 500 25"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.37;0.39;0.61;0.63;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- merge commit with code tag -->
  <rect x="384" y="28" width="32" height="16" rx="8" fill="#161b22" stroke="#a78bfa" stroke-opacity="0.7"/>
  <text x="400" y="40" text-anchor="middle" font-family="Consolas,monospace" font-size="10" font-weight="700" fill="#c084fc">&lt;/&gt;</text>
  
  <circle cx="60" cy="25" r="4.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="fill" values="#0d1117;#0d1117;#e9d5ff;#0d1117;#0d1117" keyTimes="0;0.055;0.075;0.155;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="25" r="4.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="fill" values="#0d1117;#0d1117;#e9d5ff;#0d1117;#0d1117" keyTimes="0;0.155;0.175;0.255;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="25" r="4.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="fill" values="#0d1117;#0d1117;#e9d5ff;#0d1117;#0d1117" keyTimes="0;0.255;0.275;0.355;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="25" r="4.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="fill" values="#0d1117;#0d1117;#e9d5ff;#0d1117;#0d1117" keyTimes="0;0.355;0.375;0.455;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="25" r="4.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="fill" values="#0d1117;#0d1117;#e9d5ff;#0d1117;#0d1117" keyTimes="0;0.605;0.625;0.705;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="25" r="4.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="fill" values="#0d1117;#0d1117;#e9d5ff;#0d1117;#0d1117" keyTimes="0;0.705;0.725;0.805;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="25" r="4.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="fill" values="#0d1117;#0d1117;#e9d5ff;#0d1117;#0d1117" keyTimes="0;0.805;0.825;0.905;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="25" r="4.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
    <animate attributeName="fill" values="#0d1117;#0d1117;#e9d5ff;#0d1117;#0d1117" keyTimes="0;0.905;0.925;1.000;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- travelling pulse -->
  <circle cy="25" r="6" fill="#c084fc" filter="url(#g)">
    <animate attributeName="cx" values="0;800" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="25" r="2.5" fill="#ffffff">
    <animate attributeName="cx" values="0;800" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
