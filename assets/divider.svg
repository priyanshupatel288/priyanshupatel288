<svg viewBox="0 0 800 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="15%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#7A18F5" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="50" fill="#0d1117"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="35" cy="12" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="105" cy="36" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="9" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="40" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="315" cy="15" r="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="7" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="445" cy="41" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="515" cy="13" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="585" cy="37" r="0.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="10" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="38" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="775" cy="17" r="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glowing line -->
  <rect x="0" y="23.5" width="800" height="3" fill="url(#line)" filter="url(#blur)"/>
  <rect x="0" y="24" width="800" height="2" fill="url(#line)"/>

  <!-- moving comet -->
  <circle r="1.8" fill="#e9d5ff">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 0,25 L 800,25"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
