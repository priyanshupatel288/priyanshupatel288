<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#7c3aed"/>
      <stop offset="0.8" stop-color="#9d4edd" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#9d4edd" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <style>
    .s { fill: #ffffff; animation: tw 3s ease-in-out infinite; }
    .d1 { animation-delay: 0.6s; } .d2 { animation-delay: 1.2s; }
    .d3 { animation-delay: 1.8s; } .d4 { animation-delay: 2.4s; }
    @keyframes tw { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.25; } }
  </style>

  <rect x="0" y="33" width="1200" height="3" fill="url(#line)" filter="url(#glow)"/>
  <rect x="0" y="34" width="1200" height="1.5" fill="url(#line)"/>

  <circle class="s" cx="45" cy="16" r="1.6"/>
  <circle class="s d2" cx="135" cy="52" r="1.3"/>
  <circle class="s d1" cx="220" cy="10" r="1.7"/>
  <circle class="s d3" cx="335" cy="56" r="1.1"/>
  <circle class="s d4" cx="450" cy="22" r="1.1"/>
  <circle class="s d1" cx="560" cy="8" r="1.4"/>
  <circle class="s d2" cx="650" cy="60" r="1.6"/>
  <circle class="s" cx="760" cy="15" r="1.7"/>
  <circle class="s d3" cx="870" cy="54" r="1.1"/>
  <circle class="s d4" cx="980" cy="12" r="1.7"/>
  <circle class="s d2" cx="1080" cy="56" r="1.2"/>
  <circle class="s d1" cx="1165" cy="18" r="1.4"/>
</svg>
